<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadowL" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="460" y="35" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">INVESTIGATION CASE LIFECYCLE &amp; RESOLUTION GATING</text>
  <text x="460" y="55" text-anchor="middle" fill="#94a3b8" font-size="11">Evidence-Gated Workflow Prevents Marking Problems as Resolved Without Verification</text>

  <!-- State 1: OPEN -->
  <g transform="translate(40, 95)" filter="url(#shadowL)">
    <rect x="0" y="0" width="130" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">OPEN</text>
    <text x="65" y="48" text-anchor="middle" fill="#94a3b8" font-size="9.5">Problem Reported</text>
    <text x="65" y="60" text-anchor="middle" fill="#64748b" font-size="9">Hypothesis Logged</text>
  </g>

  <!-- Arrow -->
  <line x1="170" y1="130" x2="200" y2="130" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="200,130 192,125 192,135" fill="#38bdf8"/>

  <!-- State 2: INVESTIGATING -->
  <g transform="translate(205, 95)" filter="url(#shadowL)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">INVESTIGATING</text>
    <text x="70" y="48" text-anchor="middle" fill="#94a3b8" font-size="9.5">Explain Plan Ran</text>
    <text x="70" y="60" text-anchor="middle" fill="#64748b" font-size="9">Diagnostics Checked</text>
  </g>

  <!-- Arrow -->
  <line x1="345" y1="130" x2="375" y2="130" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="375,130 367,125 367,135" fill="#38bdf8"/>

  <!-- State 3: FIX_PROPOSED -->
  <g transform="translate(380, 95)" filter="url(#shadowL)">
    <rect x="0" y="0" width="140" height="70" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="bold">FIX PROPOSED</text>
    <text x="70" y="48" text-anchor="middle" fill="#94a3b8" font-size="9.5">Query Candidate</text>
    <text x="70" y="60" text-anchor="middle" fill="#64748b" font-size="9">Index Drafted</text>
  </g>

  <!-- Arrow -->
  <line x1="520" y1="130" x2="550" y2="130" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="550,130 542,125 542,135" fill="#38bdf8"/>

  <!-- State 4: VALIDATION_REQUIRED -->
  <g transform="translate(555, 95)" filter="url(#shadowL)">
    <rect x="0" y="0" width="155" height="70" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="77" y="28" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">VALIDATION</text>
    <text x="77" y="48" text-anchor="middle" fill="#94a3b8" font-size="9.5">Equivalence Check</text>
    <text x="77" y="60" text-anchor="middle" fill="#64748b" font-size="9">Benchmark Run</text>
  </g>

  <!-- Gated Transition -->
  <line x1="710" y1="130" x2="745" y2="130" stroke="#10b981" stroke-width="2"/>
  <polygon points="745,130 737,125 737,135" fill="#10b981"/>
  <text x="728" y="120" text-anchor="middle" fill="#10b981" font-size="8" font-weight="bold">GATE</text>

  <!-- State 5: RESOLVED -->
  <g transform="translate(750, 95)" filter="url(#shadowL)">
    <rect x="0" y="0" width="135" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="67" y="28" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">RESOLVED</text>
    <text x="67" y="48" text-anchor="middle" fill="#a7f3d0" font-size="9.5">Root Cause Documented</text>
    <text x="67" y="60" text-anchor="middle" fill="#a7f3d0" font-size="9">Verification Proved</text>
  </g>

  <!-- Inconclusive Branch -->
  <path d="M 632 165 L 632 215 L 750 215" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="750,215 742,210 742,220" fill="#64748b"/>
  <g transform="translate(750, 190)">
    <rect x="0" y="0" width="135" height="50" rx="6" fill="#1e293b" stroke="#64748b"/>
    <text x="67" y="24" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">CLOSED_INCONCLUSIVE</text>
    <text x="67" y="38" text-anchor="middle" fill="#64748b" font-size="9">Insufficient Evidence</text>
  </g>
</svg>
