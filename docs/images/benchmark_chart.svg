<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="barBaseline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="barCandidate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadowB" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">REPEATABLE BENCHMARK LATENCY COMPARISON</text>
  <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">Scenario 7: Order Date Range Filter — Full Table Scan vs. Index Range Scan (5 Measured Runs)</text>

  <!-- Summary KPI Badges -->
  <g transform="translate(100, 85)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="12" y="20" fill="#94a3b8" font-size="10">Baseline Median</text>
    <text x="12" y="42" fill="#f43f5e" font-size="18" font-weight="bold" font-family="monospace">8.42 ms</text>

    <rect x="180" y="0" width="160" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="192" y="20" fill="#94a3b8" font-size="10">Candidate Median</text>
    <text x="192" y="42" fill="#34d399" font-size="18" font-weight="bold" font-family="monospace">1.91 ms</text>

    <rect x="360" y="0" width="160" height="55" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="372" y="20" fill="#94a3b8" font-size="10">Observed Speedup</text>
    <text x="372" y="42" fill="#38bdf8" font-size="18" font-weight="bold" font-family="monospace">4.41x Faster</text>

    <rect x="540" y="0" width="160" height="55" rx="8" fill="#1e293b" stroke="#059669"/>
    <text x="552" y="20" fill="#94a3b8" font-size="10">Result Equivalence</text>
    <text x="552" y="42" fill="#34d399" font-size="14" font-weight="bold" font-family="monospace">100% MATCH</text>
  </g>

  <!-- Chart Area -->
  <g transform="translate(100, 160)">
    <!-- Axes Grid -->
    <line x1="60" y1="20" x2="650" y2="20" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="50" y="24" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">10ms</text>

    <line x1="60" y1="65" x2="650" y2="65" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="50" y="69" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">7.5ms</text>

    <line x1="60" y1="110" x2="650" y2="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="50" y="114" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">5.0ms</text>

    <line x1="60" y1="155" x2="650" y2="155" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="50" y="159" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">2.5ms</text>

    <line x1="60" y1="200" x2="650" y2="200" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="204" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">0ms</text>

    <!-- Run 1 -->
    <rect x="100" y="45" width="28" height="155" rx="3" fill="url(#barBaseline)"/>
    <rect x="132" y="165" width="28" height="35" rx="3" fill="url(#barCandidate)"/>
    <text x="130" y="218" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">Run 1</text>
    <text x="114" y="38" fill="#f43f5e" font-size="9" text-anchor="middle" font-family="monospace">8.6ms</text>
    <text x="146" y="158" fill="#34d399" font-size="9" text-anchor="middle" font-family="monospace">1.9ms</text>

    <!-- Run 2 -->
    <rect x="210" y="52" width="28" height="148" rx="3" fill="url(#barBaseline)"/>
    <rect x="242" y="167" width="28" height="33" rx="3" fill="url(#barCandidate)"/>
    <text x="240" y="218" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">Run 2</text>
    <text x="224" y="45" fill="#f43f5e" font-size="9" text-anchor="middle" font-family="monospace">8.2ms</text>
    <text x="256" y="160" fill="#34d399" font-size="9" text-anchor="middle" font-family="monospace">1.8ms</text>

    <!-- Run 3 -->
    <rect x="320" y="49" width="28" height="151" rx="3" fill="url(#barBaseline)"/>
    <rect x="352" y="164" width="28" height="36" rx="3" fill="url(#barCandidate)"/>
    <text x="350" y="218" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">Run 3</text>
    <text x="334" y="42" fill="#f43f5e" font-size="9" text-anchor="middle" font-family="monospace">8.4ms</text>
    <text x="366" y="157" fill="#34d399" font-size="9" text-anchor="middle" font-family="monospace">2.0ms</text>

    <!-- Run 4 -->
    <rect x="430" y="47" width="28" height="153" rx="3" fill="url(#barBaseline)"/>
    <rect x="462" y="166" width="28" height="34" rx="3" fill="url(#barCandidate)"/>
    <text x="460" y="218" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">Run 4</text>
    <text x="444" y="40" fill="#f43f5e" font-size="9" text-anchor="middle" font-family="monospace">8.5ms</text>
    <text x="476" y="159" fill="#34d399" font-size="9" text-anchor="middle" font-family="monospace">1.9ms</text>

    <!-- Run 5 -->
    <rect x="540" y="50" width="28" height="150" rx="3" fill="url(#barBaseline)"/>
    <rect x="572" y="165" width="28" height="35" rx="3" fill="url(#barCandidate)"/>
    <text x="570" y="218" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">Run 5</text>
    <text x="554" y="43" fill="#f43f5e" font-size="9" text-anchor="middle" font-family="monospace">8.3ms</text>
    <text x="586" y="158" fill="#34d399" font-size="9" text-anchor="middle" font-family="monospace">1.9ms</text>
  </g>

  <!-- Legend -->
  <g transform="translate(320, 420)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#barBaseline)"/>
    <text x="20" y="10" fill="#cbd5e1" font-size="11">Baseline (TABLE ACCESS FULL)</text>

    <rect x="220" y="0" width="12" height="12" rx="2" fill="url(#barCandidate)"/>
    <text x="240" y="10" fill="#cbd5e1" font-size="11">Candidate (INDEX RANGE SCAN)</text>
  </g>
</svg>
