<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadowP" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="460" y="35" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">ORACLE EXECUTION PLAN HIERARCHICAL TREE</text>
  <text x="460" y="55" text-anchor="middle" fill="#94a3b8" font-size="11">Operation Nodes, Cost Propagation, and Diagnostic Observation Triggers</text>

  <!-- Root: SELECT STATEMENT -->
  <g transform="translate(340, 80)" filter="url(#shadowP)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="bold">Node 0: SELECT STATEMENT</text>
    <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="monospace">Cost: 14 • Est Rows: 50 • Time: 00:00:01</text>
  </g>

  <!-- Level 1: SORT GROUP BY -->
  <g transform="translate(340, 160)" filter="url(#shadowP)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="12" y="20" fill="#fbbf24" font-size="11" font-weight="bold">Node 1: SORT GROUP BY</text>
    <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="monospace">Cost: 14 • PGA Workarea Sort Check</text>
  </g>

  <!-- Level 2: HASH JOIN -->
  <g transform="translate(340, 240)" filter="url(#shadowP)">
    <rect x="0" y="0" width="240" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="20" fill="#10b981" font-size="11" font-weight="bold">Node 2: HASH JOIN</text>
    <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="monospace">Cost: 8 • Build Input: 100 • Probe: 300</text>
  </g>

  <!-- Children of HASH JOIN -->
  <!-- Left Child: TABLE ACCESS FULL (CUSTOMERS) -->
  <g transform="translate(100, 340)" filter="url(#shadowP)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
    <div xmlns="http://www.w3.org/1999/xhtml"></div>
    <text x="12" y="20" fill="#f43f5e" font-size="11" font-weight="bold">Node 3: TABLE ACCESS FULL [CUSTOMERS]</text>
    <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="monospace">Cost: 3 • Est Rows: 100 • Multi-block I/O</text>
    <rect x="12" y="46" width="276" height="18" rx="3" fill="#881337"/>
    <text x="18" y="59" fill="#fecdd3" font-size="9" font-family="monospace">LEAD: Full Table Scan on Small Table (INFO)</text>
  </g>

  <!-- Right Child: TABLE ACCESS BY INDEX ROWID (ORDERS) -->
  <g transform="translate(520, 340)" filter="url(#shadowP)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="bold">Node 4: TABLE ACCESS BY INDEX ROWID [ORDERS]</text>
    <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="monospace">Cost: 4 • Est Rows: 75 • Single-block I/O</text>
    <rect x="12" y="46" width="276" height="18" rx="3" fill="#075985"/>
    <text x="18" y="59" fill="#bae6fd" font-size="9" font-family="monospace">Access: ORDER_DATE &gt;= TO_TIMESTAMP(...)</text>
  </g>

  <!-- Connector Lines -->
  <line x1="460" y1="130" x2="460" y2="160" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,160 456,152 464,152" fill="#64748b"/>

  <line x1="460" y1="210" x2="460" y2="240" stroke="#64748b" stroke-width="2"/>
  <polygon points="460,240 456,232 464,232" fill="#64748b"/>

  <path d="M 400 290 L 400 315 L 250 315 L 250 340" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="250,340 246,332 254,332" fill="#64748b"/>

  <path d="M 520 290 L 520 315 L 670 315 L 670 340" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="670,340 666,332 674,332" fill="#64748b"/>
</svg>
