name: QueryPilot Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Unit & API Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest-cov

    - name: Run Backend Tests
      run: |
        python -m pytest backend/tests -v --ignore=backend/tests/integration

  frontend-build:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: |
        npm --prefix frontend install

    - name: Validate TypeScript & Build
      run: |
        npm --prefix frontend run build
